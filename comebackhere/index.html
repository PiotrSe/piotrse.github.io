<style>
:root {
    --bg: #f5f8fc;
    --card: #ffffff;
    --text: #172033;
    --muted: #5b677d;
    --accent: #1f6feb;
    --accent2: #0b4bb3;
    --border: #e2e8f0;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
}

a {
    color: var(--accent);
}

.wrap {
    max-width: 1320px;
    margin: 0 auto;
    padding: 0 28px;
}

/* =====================================================
   HERO
   ===================================================== */

header {
    background: linear-gradient(135deg, #0b1b3a 0%, #123a7a 55%, #1f6feb 100%);
    color: #ffffff;
    padding: 64px 0 60px;
}

.hero {
    display: grid;
    grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr);
    gap: 54px;
    align-items: center;
}

.hero-copy {
    min-width: 0;
}

.icon {
    display: block;
    width: 104px;
    height: 104px;
    object-fit: contain;
    border-radius: 24px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
    background: #ffffff;
    margin-bottom: 22px;
}

h1 {
    font-size: clamp(34px, 4vw, 54px);
    line-height: 1.12;
    margin: 0 0 20px;
    letter-spacing: -1px;
}

.lead {
    font-size: 19px;
    line-height: 1.7;
    color: #dce8ff;
    max-width: 560px;
    margin: 0 0 28px;
}

.btn {
    display: inline-block;
    background: #ffffff;
    color: #0b3d91;
    font-weight: 750;
    text-decoration: none;
    padding: 15px 26px;
    border-radius: 12px;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.22);
    transition: transform 0.2s ease, background 0.2s ease;
}

.btn:hover {
    background: #eaf1ff;
    transform: translateY(-2px);
}

.btn.small {
    padding: 11px 18px;
    font-size: 15px;
}

.note {
    font-size: 13px;
    color: #b9cdf2;
    margin-top: 12px;
}

/* =====================================================
   SCREENSHOTS
   ===================================================== */

.shots {
    min-width: 0;
    display: grid;
    grid-template-columns: 1.18fr 0.91fr 0.91fr;
    gap: 16px;
    align-items: center;
}

.shots img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.4);
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.3);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.shots img:first-child {
    box-shadow: 0 20px 44px rgba(0, 0, 0, 0.38);
}

.shots img:hover {
    transform: translateY(-5px);
    box-shadow: 0 22px 44px rgba(0, 0, 0, 0.38);
}

/* =====================================================
   MAIN CONTENT
   ===================================================== */

main {
    padding: 54px 0 24px;
}

section {
    margin-bottom: 58px;
}

h2 {
    font-size: 30px;
    line-height: 1.25;
    margin: 0 0 22px;
    letter-spacing: -0.4px;
}

h3 {
    font-size: 19px;
    line-height: 1.4;
    margin: 0 0 8px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 18px;
}

.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 4px 16px rgba(23, 32, 51, 0.04);
}

.card p {
    margin: 0;
    color: var(--muted);
    font-size: 15px;
}

ul.checks {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px;
}

ul.checks li {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px 16px 46px;
    position: relative;
}

ul.checks li:before {
    content: "";
    position: absolute;
    left: 18px;
    top: 23px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
}

/* =====================================================
   FAQ
   ===================================================== */

.faq {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 8px 24px;
}

details {
    border-bottom: 1px solid var(--border);
    padding: 18px 0;
}

details:last-child {
    border-bottom: 0;
}

summary {
    font-weight: 650;
    cursor: pointer;
}

details p {
    color: var(--muted);
    margin: 10px 0 0;
}

/* =====================================================
   CALL TO ACTION
   ===================================================== */

.cta {
    background: #0b1b3a;
    color: #ffffff;
    border-radius: 20px;
    padding: 38px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
}

.cta h2 {
    margin: 0 0 8px;
}

.cta p {
    margin: 0;
    color: #c9d8f5;
}

/* =====================================================
   FOOTER
   ===================================================== */

footer {
    border-top: 1px solid var(--border);
    padding: 28px 0 40px;
    color: var(--muted);
    font-size: 14px;
}

footer a {
    color: var(--muted);
}

   TABLETS
   ===================================================== */

    .wrap {
        padding: 0 24px;
    }

    header {
        padding: 48px 0;
    }

    .hero {
        grid-template-columns: 1fr;
        gap: 38px;
    }

    .hero-copy {
        max-width: 760px;
    }

    .shots {
        grid-template-columns: 1.15fr 1fr 1fr;
        gap: 18px;
        max-width: 900px;
    }

    .shots img {
        max-width: none;
    }

    .lead {
        max-width: 720px;
    }
}

    ul.checks {
        grid-template-columns: 1fr;
    }

    .card {
        padding: 20px;
    }

    .cta {
        padding: 26px 22px;
